# LAE Club — VPS production (laeclub.org)
# Requires Let's Encrypt cert at /etc/letsencrypt/live/laeclub.org/
# First-time SSL: bash deploy/setup-ssl-laeclub.org.sh

upstream lae_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name laeclub.org www.laeclub.org;

    ssl_certificate /etc/letsencrypt/live/laeclub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laeclub.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/lae;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://lae_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://lae_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name laeclub.org www.laeclub.org;
    return 301 https://$host$request_uri;
}
