# LAE Club — VPS production (laeclub.org)
# Installed to /etc/nginx/sites-available/laeclub.org

upstream lae_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

# ─── Frontend: laeclub.org + www ───
server {
    listen 80;
    listen [::]:80;
    server_name laeclub.org www.laeclub.org;

    root /var/www/lae;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─── Backend API: api.laeclub.org ───
server {
    listen 80;
    listen [::]:80;
    server_name api.laeclub.org;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://lae_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
