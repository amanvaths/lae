name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: "true"
          NEXT_PUBLIC_SITE_LIVE: "true"
          NEXT_PUBLIC_CHAIN_ID: "97"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_SENSO_CONTRACT: "0x6521619C38fe4be6B800263CC783d9524ED4F7BA"
          NEXT_PUBLIC_DAI_CONTRACT: "0xb2bE66BE07E1AD04074B32B8b13DcdFaB6B57575"
          NEXT_PUBLIC_SLT_CONTRACT: "0xc842c083E703ecf82496813cc3BFe6d36c0A49b0"
          NEXT_PUBLIC_SPIN_CONTRACT: "0xF9bdE4a2Ca487b18DA8546124b63Ec9e938ea1aE"
          NEXT_PUBLIC_STAKING_CONTRACT: "0xdb25Af21346aD358D5e52835934AF5f326169984"
          NEXT_PUBLIC_LAE_MATRIX_CONTRACT: "0xf6F271026e30a51B8B60e95e6A4280967292E661"
          NEXT_PUBLIC_LAE_MATRIX_DEPLOY_BLOCK: "116541851"
          NEXT_PUBLIC_MATRIX_CORE_CONTRACT: "0xf6F271026e30a51B8B60e95e6A4280967292E661"
          NEXT_PUBLIC_MATRIX_CORE_DEPLOY_BLOCK: "116541851"
          NEXT_PUBLIC_LAE_COIN_CONTRACT: "0xD6698E6a8Ee4712cC2E36C150f1C34e59884C45A"
          NEXT_PUBLIC_PAYMENT_TOKEN: "0xb2bE66BE07E1AD04074B32B8b13DcdFaB6B57575"

      - name: Pack build artifact
        run: tar -czf site.tar.gz -C out .

      - name: Upload to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: site.tar.gz
          target: /tmp/

      - name: Extract and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            mkdir -p /var/www/lae
            find /var/www/lae -mindepth 1 -delete
            tar -xzf /tmp/site.tar.gz -C /var/www/lae
            rm -f /tmp/site.tar.gz
            chown -R www-data:www-data /var/www/lae
            nginx -t
            systemctl reload nginx
