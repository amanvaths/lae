name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Pack build artifact
        run: tar -czf site.tar.gz -C out .

      - name: Upload to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: site.tar.gz
          target: /tmp/

      - name: Extract and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            mkdir -p /var/www/lae
            find /var/www/lae -mindepth 1 -delete
            tar -xzf /tmp/site.tar.gz -C /var/www/lae
            rm -f /tmp/site.tar.gz
            chown -R www-data:www-data /var/www/lae
            nginx -t
            systemctl reload nginx
