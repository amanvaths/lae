name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: backend-vps-deploy
  cancel-in-progress: true

env:
  DEPLOY_ROOT: /opt/lae-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint/build
        run: |
          npm run lint
          npm run build

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required GitHub Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          INDEXER_ADMIN_API_KEY: ${{ secrets.INDEXER_ADMIN_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=()
          for key in VPS_HOST VPS_USER DATABASE_URL BSC_RPC_URL INDEXER_ADMIN_API_KEY JWT_SECRET CORS_ORIGIN BACKEND_PUBLIC_URL; do
            eval "val=\${$key:-}"
            if [ -z "$val" ]; then missing+=("$key"); fi
          done
          if [ -z "${VPS_PASSWORD:-}" ] && [ -z "${VPS_SSH_KEY:-}" ]; then
            missing+=("VPS_PASSWORD or VPS_SSH_KEY")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required secrets present"

      - name: Pack backend
        run: |
          tar -czf backend.tar.gz \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=logs \
            --exclude=.env \
            -C . backend

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: backend.tar.gz
          target: /tmp/

      - name: Deploy on VPS (PM2 + migrations)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          CHAIN_ID: ${{ secrets.CHAIN_ID }}
          INDEXER_START_BLOCK: ${{ secrets.INDEXER_START_BLOCK }}
          INDEXER_ADMIN_API_KEY: ${{ secrets.INDEXER_ADMIN_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          SENSO_CONTRACT_ADDRESS: ${{ secrets.SENSO_CONTRACT_ADDRESS }}
          SLT_CONTRACT_ADDRESS: ${{ secrets.SLT_CONTRACT_ADDRESS }}
          SPIN_CONTRACT_ADDRESS: ${{ secrets.SPIN_CONTRACT_ADDRESS }}
          STAKING_CONTRACT_ADDRESS: ${{ secrets.STAKING_CONTRACT_ADDRESS }}
          DAI_CONTRACT_ADDRESS: ${{ secrets.DAI_CONTRACT_ADDRESS }}
          ADMIN_WALLET_ADDRESSES: ${{ secrets.ADMIN_WALLET_ADDRESSES }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_ROOT,DATABASE_URL,BSC_RPC_URL,CHAIN_ID,INDEXER_START_BLOCK,INDEXER_ADMIN_API_KEY,JWT_SECRET,CORS_ORIGIN,SENSO_CONTRACT_ADDRESS,SLT_CONTRACT_ADDRESS,SPIN_CONTRACT_ADDRESS,STAKING_CONTRACT_ADDRESS,DAI_CONTRACT_ADDRESS,ADMIN_WALLET_ADDRESSES
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "${DEPLOY_ROOT}/backend"
            rm -rf "${DEPLOY_ROOT}/backend/src" "${DEPLOY_ROOT}/backend/prisma" 2>/dev/null || true
            tar -xzf /tmp/backend.tar.gz -C "${DEPLOY_ROOT}"
            rm -f /tmp/backend.tar.gz

            {
              echo "NODE_ENV=production"
              echo "PORT=4000"
              echo "HOST=0.0.0.0"
              echo "DATABASE_URL=${DATABASE_URL}"
              echo "BSC_RPC_URL=${BSC_RPC_URL:-https://data-seed-prebsc-1-s1.binance.org:8545}"
              echo "CHAIN_ID=${CHAIN_ID:-97}"
              echo "INDEXER_START_BLOCK=${INDEXER_START_BLOCK:-0}"
              echo "INDEXER_BATCH_SIZE=2000"
              echo "INDEXER_POLL_MS=8000"
              echo "INDEXER_REORG_DEPTH=12"
              echo "SENSO_CONTRACT_ADDRESS=${SENSO_CONTRACT_ADDRESS:-0x74Ddbe4bcb6000bD9AA357E02B874C3D0e0248D5}"
              echo "SLT_CONTRACT_ADDRESS=${SLT_CONTRACT_ADDRESS:-0x7a509cb5cF853BaE4C4A76B7e37037cf8ec2A146}"
              echo "SPIN_CONTRACT_ADDRESS=${SPIN_CONTRACT_ADDRESS:-0xE5BD47a1bA6D742c147b74c54Ca6CFd95cACD50D}"
              echo "STAKING_CONTRACT_ADDRESS=${STAKING_CONTRACT_ADDRESS:-0xDAB2Ef2396b53D64cf22Fe58fE0275fDdb0fe5D8}"
              echo "DAI_CONTRACT_ADDRESS=${DAI_CONTRACT_ADDRESS:-0xf8E556996042b34cc706F040c59955abB678995e}"
              echo "INDEXER_ADMIN_API_KEY=${INDEXER_ADMIN_API_KEY}"
              echo "JWT_SECRET=${JWT_SECRET}"
              echo "CORS_ORIGIN=${CORS_ORIGIN}"
              echo "ADMIN_WALLET_ADDRESSES=${ADMIN_WALLET_ADDRESSES:-}"
            } > "${DEPLOY_ROOT}/backend/.env"

            chmod +x "${DEPLOY_ROOT}/backend/scripts/"*.sh
            bash "${DEPLOY_ROOT}/backend/scripts/vps-deploy.sh"
            bash "${DEPLOY_ROOT}/backend/scripts/verify-deployment.sh" "http://127.0.0.1:4000"

      - name: Verify public health endpoint
        run: |
          BASE="${{ secrets.BACKEND_PUBLIC_URL }}"
          BASE="${BASE%/}"
          curl -sf "${BASE}/health"
          curl -sf "${BASE}/api/indexer/status"
          echo "Public backend endpoints OK"
