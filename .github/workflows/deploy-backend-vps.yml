name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/deploy-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: backend-vps-deploy
  cancel-in-progress: true

env:
  DEPLOY_ROOT: /opt/lae-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint/build
        run: |
          npm run lint
          npm run build

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required GitHub Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          INDEXER_ADMIN_API_KEY: ${{ secrets.INDEXER_ADMIN_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=()
          for key in VPS_HOST VPS_USER DATABASE_URL BSC_RPC_URL INDEXER_ADMIN_API_KEY JWT_SECRET CORS_ORIGIN BACKEND_PUBLIC_URL; do
            eval "val=\${$key:-}"
            if [ -z "$val" ]; then missing+=("$key"); fi
          done
          if [ -z "${VPS_PASSWORD:-}" ] && [ -z "${VPS_SSH_KEY:-}" ]; then
            missing+=("VPS_PASSWORD or VPS_SSH_KEY")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required secrets present"

      - name: Pack backend
        run: |
          tar -czf backend.tar.gz \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=logs \
            --exclude=.env \
            -C . backend

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: backend.tar.gz
          target: /tmp/

      - name: Deploy on VPS (PM2 + migrations)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ROOT: ${{ env.DEPLOY_ROOT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          CHAIN_ID: ${{ secrets.CHAIN_ID }}
          INDEXER_START_BLOCK: ${{ secrets.INDEXER_START_BLOCK }}
          INDEXER_ADMIN_API_KEY: ${{ secrets.INDEXER_ADMIN_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          SENSO_CONTRACT_ADDRESS: ${{ secrets.SENSO_CONTRACT_ADDRESS }}
          SLT_CONTRACT_ADDRESS: ${{ secrets.SLT_CONTRACT_ADDRESS }}
          SPIN_CONTRACT_ADDRESS: ${{ secrets.SPIN_CONTRACT_ADDRESS }}
          STAKING_CONTRACT_ADDRESS: ${{ secrets.STAKING_CONTRACT_ADDRESS }}
          DAI_CONTRACT_ADDRESS: ${{ secrets.DAI_CONTRACT_ADDRESS }}
          LAE_MATRIX_CONTRACT_ADDRESS: ${{ secrets.LAE_MATRIX_CONTRACT_ADDRESS }}
          LAE_COIN_CONTRACT_ADDRESS: ${{ secrets.LAE_COIN_CONTRACT_ADDRESS }}
          RESET_INDEXER_ON_DEPLOY: "true"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: DEPLOY_ROOT,DATABASE_URL,BSC_RPC_URL,CHAIN_ID,INDEXER_START_BLOCK,INDEXER_ADMIN_API_KEY,JWT_SECRET,CORS_ORIGIN,SENSO_CONTRACT_ADDRESS,SLT_CONTRACT_ADDRESS,SPIN_CONTRACT_ADDRESS,STAKING_CONTRACT_ADDRESS,DAI_CONTRACT_ADDRESS,ADMIN_WALLET_ADDRESSES,LAE_MATRIX_CONTRACT_ADDRESS,LAE_COIN_CONTRACT_ADDRESS,RESET_INDEXER_ON_DEPLOY
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "${DEPLOY_ROOT}/backend"
            rm -rf "${DEPLOY_ROOT}/backend/src" "${DEPLOY_ROOT}/backend/prisma" 2>/dev/null || true
            tar -xzf /tmp/backend.tar.gz -C "${DEPLOY_ROOT}"
            rm -f /tmp/backend.tar.gz

            sanitize() {
              printf '%s' "$1" | tr -d '\r\n\t'
            }

            ENV_FILE="${DEPLOY_ROOT}/backend/.env"
            : > "${ENV_FILE}"
            printf '%s=%s\n' NODE_ENV production >> "${ENV_FILE}"
            printf '%s=%s\n' PORT 4000 >> "${ENV_FILE}"
            printf '%s=%s\n' HOST 0.0.0.0 >> "${ENV_FILE}"
            printf '%s=%s\n' DATABASE_URL "$(sanitize "${DATABASE_URL}")" >> "${ENV_FILE}"
            printf '%s=%s\n' BSC_RPC_URL "$(sanitize "${BSC_RPC_URL:-https://data-seed-prebsc-1-s1.binance.org:8545/}")" >> "${ENV_FILE}"
            printf '%s=%s\n' CHAIN_ID "$(sanitize "${CHAIN_ID:-97}")" >> "${ENV_FILE}"
            printf '%s=%s\n' INDEXER_START_BLOCK "$(sanitize "${INDEXER_START_BLOCK:-115660670}")" >> "${ENV_FILE}"
            printf '%s=%s\n' INDEXER_BATCH_SIZE 400 >> "${ENV_FILE}"
            printf '%s=%s\n' INDEXER_POLL_MS 8000 >> "${ENV_FILE}"
            printf '%s=%s\n' INDEXER_REORG_DEPTH 12 >> "${ENV_FILE}"
            printf '%s=%s\n' SENSO_CONTRACT_ADDRESS 0x6521619C38fe4be6B800263CC783d9524ED4F7BA >> "${ENV_FILE}"
            printf '%s=%s\n' SLT_CONTRACT_ADDRESS 0xc842c083E703ecf82496813cc3BFe6d36c0A49b0 >> "${ENV_FILE}"
            printf '%s=%s\n' SPIN_CONTRACT_ADDRESS 0xF9bdE4a2Ca487b18DA8546124b63Ec9e938ea1aE >> "${ENV_FILE}"
            printf '%s=%s\n' STAKING_CONTRACT_ADDRESS 0xdb25Af21346aD358D5e52835934AF5f326169984 >> "${ENV_FILE}"
            printf '%s=%s\n' DAI_CONTRACT_ADDRESS 0xb2bE66BE07E1AD04074B32B8b13DcdFaB6B57575 >> "${ENV_FILE}"
            printf '%s=%s\n' LAE_MATRIX_CONTRACT_ADDRESS "$(sanitize "${LAE_MATRIX_CONTRACT_ADDRESS:-0xfAD1A895b873b9C93a63BBF30BC8743d50444568}")" >> "${ENV_FILE}"
            printf '%s=%s\n' MATRIX_CORE_CONTRACT_ADDRESS "$(sanitize "${MATRIX_CORE_CONTRACT_ADDRESS:-0xfAD1A895b873b9C93a63BBF30BC8743d50444568}")" >> "${ENV_FILE}"
            printf '%s=%s\n' LAE_COIN_CONTRACT_ADDRESS "$(sanitize "${LAE_COIN_CONTRACT_ADDRESS:-0xD6698E6a8Ee4712cC2E36C150f1C34e59884C45A}")" >> "${ENV_FILE}"
            printf '%s=%s\n' LAE_MATRIX_DEPLOY_BLOCK "$(sanitize "${MATRIX_CORE_DEPLOY_BLOCK:-115660670}")" >> "${ENV_FILE}"
            printf '%s=%s\n' MATRIX_CORE_DEPLOY_BLOCK "$(sanitize "${MATRIX_CORE_DEPLOY_BLOCK:-115660670}")" >> "${ENV_FILE}"
            printf '%s=%s\n' INDEXER_ADMIN_API_KEY "$(sanitize "${INDEXER_ADMIN_API_KEY}")" >> "${ENV_FILE}"
            printf '%s=%s\n' JWT_SECRET "$(sanitize "${JWT_SECRET}")" >> "${ENV_FILE}"
            printf '%s=%s\n' CORS_ORIGIN "$(sanitize "${CORS_ORIGIN}")" >> "${ENV_FILE}"
            printf '%s=%s\n' ADMIN_WALLET_ADDRESSES "$(sanitize "${ADMIN_WALLET_ADDRESSES:-0xef9594fC5145404BfC7B5640296C3864319e3d86}")" >> "${ENV_FILE}"

            printf '%s=%s\n' RESET_INDEXER_ON_DEPLOY "$(sanitize "${RESET_INDEXER_ON_DEPLOY:-}")" >> "${ENV_FILE}"

            chmod +x "${DEPLOY_ROOT}/backend/scripts/"*.sh
            bash "${DEPLOY_ROOT}/backend/scripts/vps-deploy.sh"
            bash "${DEPLOY_ROOT}/backend/scripts/verify-deployment.sh" "http://127.0.0.1:4000"

      - name: Verify public health endpoint
        run: |
          BASE="${{ secrets.BACKEND_PUBLIC_URL }}"
          BASE="${BASE%/}"
          for i in 1 2 3 4 5; do
            if curl -sfk "${BASE}/health" >/dev/null && curl -sfk "${BASE}/api/indexer/status" >/dev/null; then
              echo "Public backend endpoints OK (attempt ${i})"
              curl -sfk "${BASE}/health"
              echo ""
              curl -sfk "${BASE}/api/indexer/status"
              exit 0
            fi
            echo "Waiting for backend… attempt ${i}/5"
            sleep 6
          done
          echo "ERROR: public health check failed after retries"
          exit 1
